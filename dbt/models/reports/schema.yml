version: 2

models:
  - name: customer_level_aggregation
    columns:
      - name: customer_id
        data_type: integer
        tests:
          - not_null
          - unique

      - name: total_transactions
        data_type: bigint
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: total_units_purchased
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: total_revenue
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: total_tax
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: total_spent
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: avg_transaction_value
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: first_transaction_date
        data_type: date
        tests:
          - not_null

      - name: last_transaction_date
        data_type: date
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= first_transaction_date"

  - name: date_level_aggregation
    columns:
      - name: transaction_date
        data_type: date
        tests:
          - not_null
          - unique

      - name: total_transactions
        data_type: bigint
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: unique_customers
        data_type: bigint
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: total_units_sold
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: total_revenue
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: total_tax
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: total_revenue_with_tax
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: avg_transaction_value
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

  - name: product_level_aggregation
    columns:
      - name: product_id
        data_type: integer
        tests:
          - not_null
          - unique

      - name: product_name
        data_type: varchar
        tests:
          - not_null

      - name: total_transactions
        data_type: bigint
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: unique_customers
        data_type: bigint
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: total_units_sold
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: total_revenue
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: total_tax
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: total_revenue_with_tax
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: avg_transaction_value
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"